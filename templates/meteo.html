{{define "meteo.html"}}
{{template "head"}}
<h1>Météo de {{.Commune.Nom}}</h1>
{{range .Jours}}
<div class="carte">
    <p>Date : {{.Date.Format "2006-01-02"}}</p>
    <p>Min : {{.Min}}</p>
    <p>Max : {{.Max}}</p>
    <p>Code météo : {{.Code}}</p>
</div>
{{end}}
<a href="/">Nouvelle recherche</a>
{{template "foot"}}
{{end}}
